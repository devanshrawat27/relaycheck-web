name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (if present)
        run: npm run type-check --if-present

      - name: Lint (if present)
        run: npm run lint --if-present

      - name: Test (if present)
        run: npm run test --if-present

      - name: Build (if present)
        run: npm run build --if-present

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      platform-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relaycheck
          POSTGRES_PASSWORD: relaycheck
          POSTGRES_DB: relaycheck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relaycheck -d relaycheck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      demo-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relaycheck
          POSTGRES_PASSWORD: relaycheck
          POSTGRES_DB: relaycheck_demo
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U relaycheck -d relaycheck_demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://relaycheck:relaycheck@127.0.0.1:5432/relaycheck
      E2E_DEMO_DATABASE_URL: postgresql://relaycheck:relaycheck@127.0.0.1:5433/relaycheck_demo
      AMQP_URL: amqp://guest:guest@127.0.0.1:5672
      E2E_API_DIR: deps/control-api
      E2E_RUNNER_DIR: deps/runner
      E2E_DEMO_DIR: deps/demo-receiver

    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4

      - name: Checkout Control API
        uses: actions/checkout@v4
        with:
          repository: devanshrawat27/relaycheck-api
          path: deps/control-api

      - name: Checkout Scenario Runner
        uses: actions/checkout@v4
        with:
          repository: devanshrawat27/relaycheck-runner
          path: deps/runner

      - name: Checkout Demo Receiver
        uses: actions/checkout@v4
        with:
          repository: devanshrawat27/relaycheck-demo-receiver
          path: deps/demo-receiver

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            deps/control-api/package-lock.json
            deps/runner/package-lock.json
            deps/demo-receiver/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix deps/control-api
          npm ci --prefix deps/runner
          npm ci --prefix deps/demo-receiver

      - name: Apply database migrations
        run: |
          cd deps/control-api
          npx prisma migrate deploy
          cd ../demo-receiver
          DATABASE_URL="$E2E_DEMO_DATABASE_URL" npx prisma migrate deploy

      - name: Build services
        run: |
          for dir in deps/control-api deps/runner deps/demo-receiver .; do
            name=$(echo "$dir" | tr "/" "_")
            if ! (cd "$dir" && npm run build) > "/tmp/build-$name.log" 2>&1; then
              echo "::error::build failed in $dir"
              tail -n 30 "/tmp/build-$name.log" | while IFS= read -r line; do echo "::error::$line"; done
              exit 1
            fi
            echo "built $dir"
          done

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

